[project]
name = "pricehunter"
version = "0.1.0"
description = "Find the best landed price (Israel and global) for a product from a URL, image or text."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "anthropic>=0.40",
]

[project.scripts]
pricehunter = "pricehunter.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pricehunter*"]

[tool.setuptools.package-data]
pricehunter = ["**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # ruff format handles wrapping; long strings are fine

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
